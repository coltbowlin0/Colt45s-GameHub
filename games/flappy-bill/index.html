<main class="wp-block-group site-content is-layout-flow wp-block-group-is-layout-flow">
	<div class="entry-content wp-block-post-content is-layout-flow wp-block-post-content-is-layout-flow"><div class="wp-block-whitehouse-raw-html" style="margin:0;"><style>

/* ---------- game page ---------- */

.game-body {
  display: flex;
  flex-direction: column;
  /* Small viewport unit: on mobile the URL bar collapses and 100vh overflows,
     which pushes the footer off-screen and scrolls the canvas mid-shot. */
  height: 100svh;
}

.game-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 12px;
  background: var(--panel);
  flex: 0 0 auto;
}

/* The footer is now the only bar on a standard game page, and it reads left to
 * right: sound, then the controls it sits beside, then the brand. flex-start
 * rather than space-between so the first two stay adjacent instead of being
 * flung to opposite ends; the brand is pushed back out on its own. */
footer.game-bar {
  justify-content: flex-start;
}

footer.game-bar .brand {
  margin-left: auto;
  flex: 0 0 auto;
}

/* The controls hint is the one footer item that can afford to lose room, so it
   is the one allowed to. A flex item defaults to min-width:auto, which refuses
   to shrink past its longest word — that is what was squeezing the pills either
   side of it rather than the text between them. */
footer.game-bar .hint {
  min-width: 0;
}

.game-bar h1 {
  margin: 0;
  /* Instrument Serif is the site's display face; the title is the one place on
     these pages that warrants it. */
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.01em;
}

.back {
  color: var(--muted);
  text-decoration: none;
}

.back:hover,
.back:focus-visible {
  color: var(--vivid-cyan);
}

.back:focus-visible {
  outline: 2px solid var(--vivid-cyan);
  outline-offset: 4px;
}

.stage {
  flex: 1 1 auto;
  min-height: 0;
  display: block;
  position: relative;
  /* The crosshair is drawn in-canvas, so hide the OS cursor over the field. */
  cursor: none;
  /* Stop a drag from selecting the page or triggering pull-to-refresh. */
  user-select: none;
  touch-action: none;
}

.pixel-screen {
  display: block;
  image-rendering: pixelated;
}



/* ---------- sound toggle ---------- */

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--navy-accent);
  border-radius: 999px;
  background: var(--zodiac-blue);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  /* "Sound on" broke across two lines in a narrow footer, which doubled the
     bar's height and shoved the playfield up. A pill label is single-line by
     definition, and the pill is not the item that should be giving ground. */
  white-space: nowrap;
  flex: 0 0 auto;
  cursor: pointer;
}

.toggle:hover {
  border-color: var(--accent);
}

/* Visible focus ring: the button is reachable by keyboard and must show it. */
.toggle:focus-visible {
  outline: 2px solid var(--vivid-cyan);
  outline-offset: 2px;
}

.toggle-icon {
  color: var(--accent);
  line-height: 1;
}

/* Muted state is carried by aria-pressed, so the styling follows the same
   source of truth the screen reader uses rather than a separate class. */
.toggle[aria-pressed="false"] {
  color: var(--muted);
}

.toggle[aria-pressed="false"] .toggle-icon {
  color: var(--muted);
  text-decoration: line-through;
}
</style>
<div class="game-body">
    <main id="game" class="stage" aria-label="Flappy Bill playfield"></main>
    <footer class="game-bar">
      <button id="sound" class="toggle" type="button" aria-pressed="true">
        <span class="toggle-icon" aria-hidden="true">♪</span>
        <span class="toggle-text">Sound on</span>
      </button>
      <span class="hint">click or space to flap &middot; M mute &middot; R restart</span>
    </footer>
</div></div></div>
</main>
