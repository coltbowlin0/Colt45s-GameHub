    <body ondragstart="return false;" ondrop="return false;" >
	<div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
          <script>
            $(document).ready(function(){
                     var oMain = new CMain({
                                    win_occurrence: 40,    
                                    min_bet: 1,  
                                    max_bet: 300,         
                                    bet_time: 10000,        
                                    money: 500,              
                                    blackjack_payout: 1.5,    
                                    game_cash: 9000,    
                                    show_credits:true,   
                                    fullscreen:false,    
                                    check_orientation:false, 
                                    audio_enable_on_startup:true, 
                                    ad_show_counter: 3  
                                });

                    $(oMain).on("recharge", function(evt) {
                            adBreak({
                                type: 'next',
                                name: 'gameended',
                                beforeAd: () => {
                                                window.parent.fullScreenOnModal.style.display="none";
                                                window.parent.fullScreenOffModal.style.display="none";
                                },
                            }); 
                            var iMoney = 500;
                            if(s_oGame !== null){
                                s_oGame.setMoney(iMoney);
                            }
                    });
                    
                    $(oMain).on("bet_placed", function (evt, iTotBet) {

                    });
                
                    $(oMain).on("start_session", function(evt) {
                    });

                    $(oMain).on("end_session", function(evt) {
                            adBreak({
                                type: 'next',
                                name: 'gameended',
                                beforeAd: () => {
                                                window.parent.fullScreenOnModal.style.display="none";
                                                window.parent.fullScreenOffModal.style.display="none";
                                },
                                afterAd: () => {window.parent.location.href="https://playpager.com/thanks/";},
                                adBreakDone: () => {window.parent.location.href="https://playpager.com/thanks/";},
                            }); 
                    });

                    $(oMain).on("save_score", function(evt,iScore) {
                    });

                    $(oMain).on("show_interlevel_ad", function(evt) {
                    });

                    $(oMain).on("share_event", function(evt, iScore) {
                    });
                    
                    if (isIOS()) {
                        setTimeout(function () {
                            sizeHandler();
                        }, 200);
                    } else {
                        sizeHandler();
                    }
           });

        </script>
        
        <div class="check-fonts">
